{% extends "base.html" %}
{% block title %}Login - ShopNest{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Login</h1>
    <p>Access your ShopNest account.</p>
    <form method="post">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn full">Login</button>
    </form>
    <p class="muted">Demo user: user@example.com / user123</p>
</div>
{% endblock %}
